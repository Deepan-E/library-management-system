<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .hdr-main { fill: #1e3a8a; }
      .hdr-link { fill: #9a3412; }
      .hdr-solo { fill: #475569; }
      .hdr-t { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .row { font-size: 12.5px; fill: #0f172a; }
      .typ { font-size: 11.5px; fill: #64748b; }
      .key { font-size: 10.5px; font-weight: 700; }
      .pk { fill: #b45309; }
      .fk { fill: #1d4ed8; }
      .sep { stroke: #e2e8f0; stroke-width: 1; }
      .rel { stroke: #334155; stroke-width: 1.8; fill: none; }
      .lbl { font-size: 12px; fill: #334155; font-style: italic; }
      .card { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .note { font-size: 11.5px; fill: #475569; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>
  <rect class="bg" width="900" height="560"/>
  <text class="title" x="450" y="30" text-anchor="middle">Library Management System – ER Diagram</text>

  <!-- ===================== BOOKS ===================== -->
  <rect class="box" x="30" y="70" width="270" height="200" rx="6"/>
  <path class="hdr-main" d="M30 76 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v18 h-270 z"/>
  <rect class="hdr-main" x="30" y="70" width="270" height="30" rx="6"/>
  <text class="hdr-t" x="165" y="91" text-anchor="middle">books</text>
  <text class="key pk" x="40"  y="120">PK</text><text class="row" x="68" y="120">book_id</text><text class="typ" x="290" y="120" text-anchor="end">INT, AUTO_INC</text>
  <line class="sep" x1="30" x2="300" y1="128" y2="128"/>
  <text class="row" x="68" y="146">title</text><text class="typ" x="290" y="146" text-anchor="end">VARCHAR(120) NN</text>
  <text class="row" x="68" y="167">author</text><text class="typ" x="290" y="167" text-anchor="end">VARCHAR(80) NN</text>
  <text class="row" x="68" y="188">category</text><text class="typ" x="290" y="188" text-anchor="end">VARCHAR(50) NN</text>
  <text class="row" x="68" y="209">total_copies</text><text class="typ" x="290" y="209" text-anchor="end">INT NN, CHECK ≥ 0</text>
  <text class="row" x="68" y="230">available_copies</text><text class="typ" x="290" y="230" text-anchor="end">INT NN, 0..total</text>
  <text class="note" x="40" y="256">Indexes: title, author</text>

  <!-- ===================== MEMBERS ===================== -->
  <rect class="box" x="600" y="70" width="270" height="140" rx="6"/>
  <rect class="hdr-main" x="600" y="70" width="270" height="30" rx="6"/>
  <text class="hdr-t" x="735" y="91" text-anchor="middle">members</text>
  <text class="key pk" x="610" y="120">PK</text><text class="row" x="638" y="120">member_id</text><text class="typ" x="860" y="120" text-anchor="end">INT, AUTO_INC</text>
  <line class="sep" x1="600" x2="870" y1="128" y2="128"/>
  <text class="row" x="638" y="146">full_name</text><text class="typ" x="860" y="146" text-anchor="end">VARCHAR(60) NN</text>
  <text class="row" x="638" y="167">phone</text><text class="typ" x="860" y="167" text-anchor="end">CHAR(10) NN, UNIQUE</text>
  <text class="row" x="638" y="188">is_active</text><text class="typ" x="860" y="188" text-anchor="end">TINYINT(1) NN, DEFAULT 1</text>

  <!-- ===================== ISSUES ===================== -->
  <rect class="box" x="290" y="330" width="320" height="215" rx="6"/>
  <rect class="hdr-link" x="290" y="330" width="320" height="30" rx="6"/>
  <text class="hdr-t" x="450" y="351" text-anchor="middle">issues  (link table)</text>
  <text class="key pk" x="300" y="380">PK</text><text class="row" x="328" y="380">issue_id</text><text class="typ" x="600" y="380" text-anchor="end">INT, AUTO_INC</text>
  <line class="sep" x1="290" x2="610" y1="388" y2="388"/>
  <text class="key fk" x="300" y="406">FK</text><text class="row" x="328" y="406">book_id</text><text class="typ" x="600" y="406" text-anchor="end">INT NN → books</text>
  <text class="key fk" x="300" y="427">FK</text><text class="row" x="328" y="427">member_id</text><text class="typ" x="600" y="427" text-anchor="end">INT NN → members</text>
  <text class="row" x="328" y="448">issue_date</text><text class="typ" x="600" y="448" text-anchor="end">DATE NN</text>
  <text class="row" x="328" y="469">due_date</text><text class="typ" x="600" y="469" text-anchor="end">DATE NN (issue + 14 days)</text>
  <text class="row" x="328" y="490">return_date</text><text class="typ" x="600" y="490" text-anchor="end">DATE NULL until returned</text>
  <text class="row" x="328" y="511">fine_amount</text><text class="typ" x="600" y="511" text-anchor="end">INT NN, DEFAULT 0 (Rs)</text>
  <text class="row" x="328" y="532">status</text><text class="typ" x="600" y="532" text-anchor="end">ENUM('ISSUED','RETURNED')</text>

  <!-- ===================== USERS ===================== -->
  <rect class="box" x="30" y="330" width="245" height="140" rx="6" stroke-dasharray="5 4"/>
  <rect class="hdr-solo" x="30" y="330" width="245" height="30" rx="6"/>
  <text class="hdr-t" x="152" y="351" text-anchor="middle">users</text>
  <text class="key pk" x="40" y="380">PK</text><text class="row" x="68" y="380">user_id</text><text class="typ" x="265" y="380" text-anchor="end">INT, AUTO_INC</text>
  <line class="sep" x1="30" x2="275" y1="388" y2="388"/>
  <text class="row" x="48" y="406">username</text><text class="typ" x="265" y="406" text-anchor="end">VARCHAR(30) UNIQUE</text>
  <text class="row" x="48" y="427">password_hash</text><text class="typ" x="265" y="427" text-anchor="end">VARCHAR(200) NN</text>
  <text class="row" x="48" y="448">role</text><text class="typ" x="265" y="448" text-anchor="end">ENUM(ADMIN,LIBRARIAN)</text>
  <text class="note" x="30" y="492">Login only – no relationship</text>
  <text class="note" x="30" y="508">with the other tables.</text>

  <!-- ===================== RELATIONSHIPS ===================== -->
  <!-- books (1) -> issues (N) -->
  <path class="rel" d="M165 270 V300 H370 V330"/>
  <text class="card" x="150" y="288" text-anchor="end">1</text>
  <text class="card" x="380" y="322">N</text>
  <text class="lbl" x="200" y="294">is issued in</text>
  <!-- crow's foot at issues top -->
  <path class="rel" d="M370 330 L360 316 M370 330 L380 316 M370 330 V314" stroke-width="1.4"/>
  <!-- bar at books side -->
  <path class="rel" d="M157 280 H173" stroke-width="2.2"/>

  <!-- members (1) -> issues (N) -->
  <path class="rel" d="M735 210 V300 H530 V330"/>
  <text class="card" x="722" y="228" text-anchor="end">1</text>
  <text class="card" x="540" y="322">N</text>
  <text class="lbl" x="580" y="294">borrows</text>
  <path class="rel" d="M530 330 L520 316 M530 330 L540 316 M530 330 V314" stroke-width="1.4"/>
  <path class="rel" d="M727 222 H743" stroke-width="2.2"/>

  <!-- Legend -->
  <rect x="640" y="400" width="230" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="row" x="652" y="420" font-weight="700">Legend</text>
  <text class="key pk" x="652" y="440">PK</text><text class="note" x="682" y="440">Primary key</text>
  <text class="key fk" x="652" y="458">FK</text><text class="note" x="682" y="458">Foreign key</text>
  <text class="note" x="652" y="476">NN = NOT NULL</text>
  <text class="note" x="652" y="494">1 — N : one-to-many</text>
  <text class="note" x="652" y="512">books &lt;-&gt; members : many-to-many</text>
  <text class="note" x="652" y="526">(resolved through issues)</text>
</svg>
